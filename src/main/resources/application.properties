server.port=8080

# Upload limits (large video files)
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# Streamer application configuration
app.upload-dir=./uploads
app.export-dir=./exports
app.default-cols=160
app.default-font-aspect=0.5
app.target-lead-sec=0.4

# Disable caching for instant UI updates
spring.web.resources.cache.cachecontrol.max-age=0
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.chain.cache=false

# Logging
logging.level.com.asciistreamer=INFO
logging.level.org.springframework.web.socket=INFO
